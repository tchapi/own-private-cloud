[http.middlewares]
  [http.middlewares.security.headers]
    stsSeconds = 31536000

  # Forward-auth to Authelia, used by the routers that have no login of their own (status, davis admin, webmail).
  # Defined here rather than in Authelia's labels so it exists even while Authelia is starting or down.
  # Traefik reaches Authelia directly on auth_network.
  [http.middlewares.authelia.forwardAuth]
    address = "http://authelia:9091/api/authz/forward-auth"
    trustForwardHeader = true
    authResponseHeaders = ["Remote-User", "Remote-Groups", "Remote-Name", "Remote-Email"]

[tls]
  [tls.options]
    [tls.options.default]
      minVersion = "VersionTLS12"
      cipherSuites = [
        "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256",
        "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384",
        "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
      ]
      # sniStrict = true
